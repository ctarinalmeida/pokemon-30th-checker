name: Verificar Pokémon 30th Anniversary

on:
  schedule:
    # Corre a cada 5 minutos (o mínimo suportado pelo GitHub Actions).
    # Nota: para isto não gastar os minutos grátis, o repositório deve ser público.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}  # permite correr manualmente a partir do GitHub

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install requests beautifulsoup4

      - name: Correr verificação
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python verificar_pokemon_30th.py
